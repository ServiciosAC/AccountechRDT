name: Ultimate - Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    name: Start RDP Session
    runs-on: windows-latest
    timeout-minutes: 360 # Keeps the VM alive for 6 hours

    steps:
      - name: 1. Download & Install LiteManager (Official)
        run: |
          echo "Downloading official LiteManager Host..."
          Invoke-WebRequest -Uri "https://litemanager.com/files/LiteManager%20Pro%20-%20Server.msi" -OutFile "LMSERVER.msi"
          
          echo "Installing (Silent Mode)..."
          Start-Process msiexec.exe -ArgumentList "/i LMSERVER.msi /qn /norestart" -Wait
          
      - name: 2. Configure Security & Firewall
        run: |
          echo "Setting RDP Password to: TheDisa1a"
          # This command injects the password and settings directly into the registry
          $regPath = "HKLM:\SOFTWARE\LiteManager\v4.0\Host\Common"
          if (!(Test-Path $regPath)) { New-Item -Path $regPath -Force }
          Set-ItemProperty -Path $regPath -Name "Password" -Value "TheDisa1a"
          
          echo "Opening Firewall..."
          netsh advfirewall set allprofiles state off

      - name: 3. Start Service & Generate ID
        run: |
          echo "Starting ROMServer Service..."
          net start ROMServer
          
          echo "Waiting 60 seconds for the ID Server to respond..."
          # This replaces the 'timeout' command which was crashing your script
          powershell -Command "Start-Sleep -s 60"

      - name: 4. Display Connection Details
        run: |
          $id = (Get-ItemProperty -Path "HKLM:\SOFTWARE\LiteManager\v4.0\Host\Common").ConnectID
          echo "=========================================="
          echo "        WINDOWS RDP IS READY!             "
          echo "=========================================="
          echo " USERNAME: runneradmin"
          echo " PASSWORD: TheDisa1a"
          echo " LITEMANAGER ID: $id"
          echo "=========================================="
          
          if (!$id) { echo "ERROR: ID still not generated. Try restarting the workflow." }

      - name: 5. Keep Alive
        run: |
          echo "Keep-alive loop started. Session will last 6 hours."
          while($true) { Start-Sleep -Seconds 3600 }
    
