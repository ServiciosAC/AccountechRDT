name: Windows - Litemanager

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building
    runs-on: windows-latest

    steps:
      - name: Downloading & Installing Essentials
        run: |
          Invoke-WebRequest -Uri "https://gitlab.com/chamod12/lm_win-10_github_rdp/-/raw/main/Downloads.bat" -OutFile "Download.bat"
          cmd /c Download.bat

      - name: Connect to LiteManager
        run: |
          echo "Disabling Firewall to allow ID generation..."
          netsh advfirewall set allprofiles state off
          
          echo "Waiting 30 seconds for LiteManager to receive an ID..."
          timeout /t 30 /nobreak > nul
          
          echo "Executing show.bat..."
          cmd /c show.bat
          
          echo "--- BACKUP ID CHECK (Look below if ID is blank) ---"
          reg query "HKEY_LOCAL_MACHINE\SOFTWARE\LiteManager\v4.0\Host\Common" /v "ConnectID" || echo "ID not assigned yet."

      - name: Time Counter 
        run: cmd /c loop.bat
    
