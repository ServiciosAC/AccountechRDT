name: Windows - Litemanager

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building
    runs-on: windows-latest

    steps:
      - name: Downloading & Installing Essentials
        run: |
          # 1. Download
          Invoke-WebRequest -Uri "https://gitlab.com/chamod12/lm_win-10_github_rdp/-/raw/main/Downloads.bat" -OutFile "Download.bat"
          # 2. Install
          cmd /c Download.bat

      - name: Connect to LiteManager
        shell: powershell
        run: |
          # Kill the firewall to ensure the ID server can talk to us
          netsh advfirewall set allprofiles state off
          
          Write-Host "Waiting 60 seconds for LiteManager to receive an ID..."
          # This replaces the broken 'timeout' command
          Start-Sleep -s 60
          
          Write-Host "Running show.bat..."
          cmd /c show.bat
          
          Write-Host "--- BACKUP ID CHECK (Manual Registry Read) ---"
          # This command looks inside the Windows 'Brain' for the ID
          $regKey = "HKLM:\SOFTWARE\LiteManager\v4.0\Host\Common"
          if (Test-Path $regKey) {
              $id = (Get-ItemProperty -Path $regKey).ConnectID
              Write-Host "LITEMANAGER ID FOUND: $id"
          } else {
              Write-Host "ERROR: LiteManager Registry not found. The installation likely failed."
          }

      - name: Time Counter 
        run: cmd /c loop.bat
