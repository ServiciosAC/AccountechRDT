name: Windows - Litemanager

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building
    runs-on: windows-latest

    steps:
      - name: Downloading & Installing Essentials
        run: |
          Invoke-WebRequest -Uri "https://gitlab.com/chamod12/lm_win-10_github_rdp/-/raw/main/Downloads.bat" -OutFile "Download.bat"
          cmd /c Download.bat

      - name: Connect to LiteManager
        run: |
          # Wait 30 seconds for the ID server to respond
          timeout /t 30 /nobreak > nul
          # Now run the show script
          cmd /c show.bat  
        
      - name: Time Counter 
        run: cmd /c loop.bat
    
